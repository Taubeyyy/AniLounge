name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'AniLoungeTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: WebKit-Filter kompilieren
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: Player-Lebenszyklus im Simulator prüfen
        timeout-minutes: 12
        run: bash scripts/test-ios.sh
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Neuer Look im Streaming-Stil: Hero-Karussell, Weiterschauen-Kacheln, Poster-Raster in Suche und Watchlist, neue Detailseite mit smartem Abspielen-Knopf, animierte Tableiste und ein neues App-Icon.
          Player neu: Video oben, Infos darunter, im Querformat randlos. Bild-in-Bild läuft weiter, während du in der App stöberst. „Opening überspringen“, „10 s zurück“ und ein Countdown zur nächsten Folge direkt auf dem Video.
          Downloads: jetzt auch über Mobilfunk und mit Referer des Anbieters, damit mehr Hoster den Download erlauben. Der Download-Knopf ist sichtbar, sobald die Folge im iOS-Player läuft.
          Mit TrollStore als Update installieren, um lokale Daten zu behalten. Laufende 0.5-Downloads werden als unterbrochen markiert.
          NOTES
          gh release create v0.6.0 build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge 0.6.0" --notes-file build/release-notes.md


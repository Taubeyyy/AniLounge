name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'AniLoungeTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: WebKit-Filter kompilieren
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: Player-Lebenszyklus im Simulator prüfen
        timeout-minutes: 12
        run: bash scripts/test-ios.sh
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Eigener Player im Crunchyroll-Stil: Tippen blendet die Steuerung ein, Doppeltippen links/rechts springt 10 s, Zeitleiste mit Puffer, Vollbild-Knopf, Bildschirm füllen, Geschwindigkeit, Bild-in-Bild und Steuerung im Sperrbildschirm.
          Behoben: weißer Bildschirm nach dem Drehen. Die App bleibt beim Stöbern im Hochformat, nur der Player dreht sich.
          VOE startet ohne Tippen (JW-Player-Start) und läuft öfter im iOS-Player (Master-Playlist wird erkannt).
          Neuer Tab „Ich“ mit Profilwechsel, Statistik, Verlauf und Einstellungen: Autoplay, Opening automatisch überspringen, Geschwindigkeit, Datensparmodus, bevorzugte Sprache und Anbieter, Werbeblocker, Downloads nur über WLAN, Speicher, Cache und Zurücksetzen.
          Mit TrollStore als Update installieren, um lokale Daten zu behalten.
          NOTES
          gh release create v0.9.0 build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge 0.9.0" --notes-file build/release-notes.md


name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Eigene lila Navigation, Profilkarten und Suche. Folgen starten mit bevorzugter Quelle; Quelle und Sprache lassen sich ändern und werden gemerkt. Fehlende Cover werden nachgeladen und Bilder zwischengespeichert.
          Native Anbieterauswahl und AVPlayer für erkannte MP4-/HLS-Links, mit Webplayer als Alternative und blockierten Popup-Fenstern.
          IPA mit TrollStore als Update installieren, um lokale Daten zu behalten.
          Profile sind lokal ohne Cloud-Synchronisation. Native Wiedergabe hängt vom Anbieter ab. Auf echtem Gerät noch nicht geprüft.
          NOTES
          gh release create v0.3.0 build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge 0.3.0" --notes-file build/release-notes.md


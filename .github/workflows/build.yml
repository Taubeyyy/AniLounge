name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'AniLoungeTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: WebKit-Filter kompilieren
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: Player-Lebenszyklus im Simulator prüfen
        timeout-minutes: 12
        run: bash scripts/test-ios.sh
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DerivedData/Build/Products/Release-iphoneos/AniLounge.app/Info.plist)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Release tag does not match the built app version" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its published IPA."
          else
            gh release create "$tag" build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge $version" --notes-file RELEASE_NOTES.md
          fi


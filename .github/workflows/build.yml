name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'AniLoungeTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: WebKit-Filter kompilieren
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: Player-Lebenszyklus im Simulator prüfen
        timeout-minutes: 12
        run: bash scripts/test-ios.sh
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Aufgeräumtes Design: eigene Kopfleisten, die über Bildern transparent sind und beim Scrollen milchig werden (kein springendes Info-Symbol mehr), breite Bilder auf der Startseite, Staffel-Auswahl als Pills, Folgenliste mit Vorschaubildern und Sprachkürzeln (DE, DE-Sub, EN-Sub), eigene Bottom-Sheets statt Systemmenüs.
          Player: „Opening überspringen“ nur noch während des echten Openings (AniSkip), im Abspann „Nächste Folge“. Alle Folgen der Staffel direkt unter dem Player. Weitere Optionen im Mehr-Menü.
          Videos starten ohne extra Tippen: Player mit preload="none" werden geweckt, notfalls drückt die App den Play-Knopf des Players (nie Links).
          Folgen gelten im Abspann als gesehen. Bilder und Titel jetzt auch für spätere Staffeln (z. B. Dr. Stone Staffel 4).
          Mit TrollStore als Update installieren, um lokale Daten zu behalten.
          NOTES
          gh release create v0.8.0 build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge 0.8.0" --notes-file build/release-notes.md


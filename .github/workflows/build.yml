name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'AniLoungeTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: WebKit-Filter kompilieren
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: Player-Lebenszyklus im Simulator prüfen
        timeout-minutes: 12
        run: bash scripts/test-ios.sh
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Vollbild repariert: Im Querformat füllt das Video jetzt wirklich den ganzen Bildschirm, auch neben der Notch, und die Steuerung liegt richtig.
          Behoben: Nach dem Drehen blieb manchmal nur das Video über der Startseite stehen. Der Player öffnet jetzt immer von einer festen Stelle aus und kann beim Drehen nicht mehr verloren gehen.
          Mit TrollStore als Update installieren, um lokale Daten zu behalten.
          NOTES
          gh release create v0.9.3 build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge 0.9.3" --notes-file build/release-notes.md


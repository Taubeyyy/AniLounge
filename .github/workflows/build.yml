name: Build AniLounge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AniLounge/**'
      - 'Core/**'
      - 'AniLoungeTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: anilounge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Player-Skript testen
        run: node --test scripts/playback-tracker.test.cjs
      - name: Parser und Profilspeicher testen
        run: swift test --package-path Core
      - name: WebKit-Filter kompilieren
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: Player-Lebenszyklus im Simulator prüfen
        timeout-minutes: 12
        run: bash scripts/test-ios.sh
      - name: IPA bauen
        run: bash scripts/build-ipa.sh
      - name: IPA bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AniLounge-TrollStore
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          Ladebildschirm: Die Anbieter-Seite mit ihrer Werbung bleibt verdeckt, bis unser Player das Video hat. Dauert es länger, gibt es „Webplayer zeigen“ und „Andere Quelle“.
          Behoben: VOE-Streams wurden vom Autostart-Script versehentlich neu geladen und brachen ab.
          Behoben: Läuft eine Folge im Webplayer, aber nicht im iOS-Player, bleibt sie jetzt dort statt die Quelle zu wechseln.
          Behoben: Im Querformat fehlte beim Laden und im Webplayer ein Schließen-Knopf.
          Behoben: Ruckeln auf der Downloads-Seite während laufender Downloads; alter Timer beim Folgenwechsel; doppelte Player bei Doppeltipp.
          Der iOS-Player fragt Videos mit derselben Browser-Kennung an wie die Anbieter-Seite.
          Mit TrollStore als Update installieren, um lokale Daten zu behalten.
          NOTES
          gh release create v0.9.4 build/AniLounge.ipa --target "$GITHUB_SHA" --title "AniLounge 0.9.4" --notes-file build/release-notes.md


name: Verify playback flows
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core regression tests
        run: swift test --package-path Core
      - name: Web tracker regression tests
        run: node --test scripts/playback-tracker.test.cjs
      - name: Compile WebKit rules
        run: |
          cat Core/Sources/AniCore/AdBlockRules.swift scripts/check-content-rules.swift > "$RUNNER_TEMP/check-content-rules.swift"
          swift "$RUNNER_TEMP/check-content-rules.swift"
      - name: iOS regression tests
        timeout-minutes: 15
        run: TEST_RESULT_BUNDLE=build/iOS-Tests.xcresult bash scripts/test-ios.sh
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/iOS-Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/iOS-Tests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniLounge-simulator-screenshots
          path: build/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Build and validate IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AniLounge-review-IPA
          path: build/AniLounge.ipa
          if-no-files-found: error
          retention-days: 14
